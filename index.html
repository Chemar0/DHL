<!doctype html>
<!-- File purpose: Landing page markup and navigation entry point for the mechanical and electrical parts lists. -->
<html lang="en" data-site-access-scripts="landing.js">
<head>
    <script>
        (() => {
            const page = document.documentElement;
            let resume = false;
            try { resume = Boolean(sessionStorage.getItem('dhl-approved-session-user')); } catch (error) { /* Storage can be disabled. */ }
            page.classList.add(resume ? 'site-access-resuming' : 'site-access-locked');
            for (const src of (page.dataset.siteAccessScripts || '').split('|').filter(Boolean)) {
                const preload = document.createElement('link');
                preload.rel = 'preload';
                preload.as = 'script';
                preload.href = src;
                document.head.append(preload);
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a parts list</title>
    <link rel="stylesheet" href="site-theme.css?v=professional-1">
    <link rel="stylesheet" href="landing.css?v=professional-1">
    <link rel="stylesheet" href="site-access.css?v=site-confirm-1">
    <script defer src="supabase-config.js?v=shared-cart-clear-1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="site-access.js?v=access-number-flow-3"></script>
</head>
<body>
    <main class="landing-card">
        <p class="landing-kicker">DHL · Operations</p>
        <img class="site-logo" src="logo.svg" alt="">
        <h1>Parts lists</h1>
        <p class="landing-intro">Choose a list to browse parts and build your order.</p>
        <div class="section-buttons">
            <button type="button" id="mechanical-button">
                <span class="section-button-copy"><strong>Mechanical</strong><small>Fasteners and mechanical consumables</small></span>
                <span class="section-arrow" aria-hidden="true">↗</span>
            </button>
            <button type="button" id="electrical-button">
                <span class="section-button-copy"><strong>Electrical</strong><small>Electrical parts and consumables</small></span>
                <span class="section-arrow" aria-hidden="true">↗</span>
            </button>
        </div>
    </main>
</body>
</html>
