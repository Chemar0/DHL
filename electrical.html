<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Parts List</title>
    <link rel="stylesheet" href="ani.css">
</head>
<body>
    <button class="admin-entry" type="button" aria-label="Open admin page" title="Admin">Admin</button>
    <button class="cart-toggle" id="cart-toggle" type="button" aria-controls="cart-panel" aria-expanded="false">
        Cart <span class="cart-count" id="cart-count">0</span>
    </button>
    <div class="cart-backdrop" id="cart-backdrop" hidden></div>
    <aside class="cart-panel" id="cart-panel" aria-label="Shopping cart" aria-hidden="true" inert>
        <div class="cart-header">
            <h2>Your cart</h2>
            <button class="cart-close" id="cart-close" type="button" aria-label="Close cart">×</button>
        </div>
        <button class="clear-cart" id="clear-cart" type="button">Clear cart</button>
        <p id="cart-sync-status" role="status" aria-live="polite"></p>
        <p class="cart-empty" id="cart-empty">Your cart is empty.</p>
        <ul class="cart-items" id="cart-items" aria-live="polite"></ul>
        <div class="cart-actions">
            <button class="email-cart" id="email-cart" type="button" disabled>Email parts list</button>
        </div>
    </aside>
    <dialog class="email-confirm" id="email-confirm" aria-labelledby="email-confirm-title">
        <h2 id="email-confirm-title">Create email?</h2>
        <p>Open an email draft with the parts in your cart?</p>
        <div class="email-confirm-actions">
            <button id="email-no" type="button">No</button>
            <button id="email-yes" type="button">Yes</button>
        </div>
    </dialog>
    <dialog class="quantity-dialog" id="quantity-dialog" aria-labelledby="quantity-dialog-title">
        <form id="quantity-form">
            <h2 id="quantity-dialog-title">Add item to cart</h2>
            <p id="quantity-item-name"></p>
            <label for="requested-quantity">How many would you like?</label>
            <input id="requested-quantity" type="number" min="1" step="1" value="1" required>
            <div class="quantity-dialog-actions">
                <button id="quantity-cancel" type="button">Cancel</button>
                <button class="quantity-submit" type="submit">Add to cart</button>
            </div>
        </form>
    </dialog>
    <div class="main-layout">
        <img class="site-logo" src="logo.svg" alt="">
        <main class="box">
            <h1>Electrical Parts List</h1>
            <div class="tabs" role="tablist" aria-label="Electrical categories">
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab active" id="tab-1" role="tab" aria-selected="true" aria-controls="panel-1" tabindex="0">Cable Indents</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-2" role="tab" aria-selected="false" aria-controls="panel-2" tabindex="-1">Connectors</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-3" role="tab" aria-selected="false" aria-controls="panel-3" tabindex="-1">Switches</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-4" role="tab" aria-selected="false" aria-controls="panel-4" tabindex="-1">Fuses</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-5" role="tab" aria-selected="false" aria-controls="panel-5" tabindex="-1">Relays</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-6" role="tab" aria-selected="false" aria-controls="panel-6" tabindex="-1">Sensors</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-7" role="tab" aria-selected="false" aria-controls="panel-7" tabindex="-1">Power Supplies</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-8" role="tab" aria-selected="false" aria-controls="panel-8" tabindex="-1">Terminals</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-9" role="tab" aria-selected="false" aria-controls="panel-9" tabindex="-1">Lighting</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-10" role="tab" aria-selected="false" aria-controls="panel-10" tabindex="-1">Motors</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-11" role="tab" aria-selected="false" aria-controls="panel-11" tabindex="-1">Control Gear</button>
                <!-- To rename this tab, change its label here and the matching category key in electrical-inventory.js. -->
                <button class="tab" id="tab-12" role="tab" aria-selected="false" aria-controls="panel-12" tabindex="-1">Other Electrical</button>
            </div>
            <!-- Cable Indents items are managed from electrical-admin.html or listed in the Cable Indents array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1"><div class="inner-box"></div></section>
            <!-- Connectors items are managed from electrical-admin.html or listed in the Connectors array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden><div class="inner-box"></div></section>
            <!-- Switches items are managed from electrical-admin.html or listed in the Switches array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden><div class="inner-box"></div></section>
            <!-- Fuses items are managed from electrical-admin.html or listed in the Fuses array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-4" role="tabpanel" aria-labelledby="tab-4" hidden><div class="inner-box"></div></section>
            <!-- Relays items are managed from electrical-admin.html or listed in the Relays array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-5" role="tabpanel" aria-labelledby="tab-5" hidden><div class="inner-box"></div></section>
            <!-- Sensors items are managed from electrical-admin.html or listed in the Sensors array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-6" role="tabpanel" aria-labelledby="tab-6" hidden><div class="inner-box"></div></section>
            <!-- Power Supplies items are managed from electrical-admin.html or listed in the Power Supplies array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-7" role="tabpanel" aria-labelledby="tab-7" hidden><div class="inner-box"></div></section>
            <!-- Terminals items are managed from electrical-admin.html or listed in the Terminals array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-8" role="tabpanel" aria-labelledby="tab-8" hidden><div class="inner-box"></div></section>
            <!-- Lighting items are managed from electrical-admin.html or listed in the Lighting array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-9" role="tabpanel" aria-labelledby="tab-9" hidden><div class="inner-box"></div></section>
            <!-- Motors items are managed from electrical-admin.html or listed in the Motors array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-10" role="tabpanel" aria-labelledby="tab-10" hidden><div class="inner-box"></div></section>
            <!-- Control Gear items are managed from electrical-admin.html or listed in the Control Gear array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-11" role="tabpanel" aria-labelledby="tab-11" hidden><div class="inner-box"></div></section>
            <!-- Other Electrical items are managed from electrical-admin.html or listed in the Other Electrical array in electrical-inventory.js. -->
            <section class="tab-panel" id="panel-12" role="tabpanel" aria-labelledby="tab-12" hidden><div class="inner-box"></div></section>
        </main>
    </div>
    <script src="supabase-config.js?v=shared-cart-clear-1"></script>
    <script src="electrical-inventory.js"></script>
    <script src="electrical.js?v=shared-cart-clear-1"></script>
</body>
</html>
