<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastener List</title>
    <link rel="stylesheet" href="ani.css">
</head>
<body>
    <button class="admin-entry" type="button" aria-label="Open admin page" title="Admin">Admin</button>
    <button class="cart-toggle" id="cart-toggle" type="button" aria-controls="cart-panel" aria-expanded="false">
        Cart <span class="cart-count" id="cart-count">0</span>
    </button>
    <div class="cart-backdrop" id="cart-backdrop" hidden></div>
    <aside class="cart-panel" id="cart-panel" aria-label="Shopping cart" aria-hidden="true" inert>
        <div class="cart-header">
            <h2>Your cart</h2>
            <button class="cart-close" id="cart-close" type="button" aria-label="Close cart">×</button>
        </div>
        <button class="clear-cart" id="clear-cart" type="button">Clear cart</button>
        <p id="cart-sync-status" role="status" aria-live="polite"></p>
        <p class="cart-empty" id="cart-empty">Your cart is empty.</p>
        <ul class="cart-items" id="cart-items" aria-live="polite"></ul>
        <div class="cart-actions">
            <button class="email-cart" id="email-cart" type="button" disabled>Email parts list</button>
        </div>
    </aside>
    <dialog class="email-confirm" id="email-confirm" aria-labelledby="email-confirm-title">
        <h2 id="email-confirm-title">Create email?</h2>
        <p>Open an email draft with the parts in your cart?</p>
        <div class="email-confirm-actions">
            <button id="email-no" type="button">No</button>
            <button id="email-yes" type="button">Yes</button>
        </div>
    </dialog>
    <dialog class="quantity-dialog" id="quantity-dialog" aria-labelledby="quantity-dialog-title">
        <form id="quantity-form">
            <h2 id="quantity-dialog-title">Add item to cart</h2>
            <p id="quantity-item-name"></p>
            <label for="requested-quantity">How many would you like?</label>
            <input id="requested-quantity" type="number" min="1" step="1" value="1" required>
            <div class="quantity-dialog-actions">
                <button id="quantity-cancel" type="button">Cancel</button>
                <button class="quantity-submit" type="submit">Add to cart</button>
            </div>
        </form>
    </dialog>
    <div class="main-layout">
        <img class="site-logo" src="logo.svg" alt="">
        <main class="box">
            <h1>Fastener List</h1>

        <div class="tabs" role="tablist" aria-label="Fastener categories">
            <button class="tab active" id="tab-1" role="tab" aria-selected="true" aria-controls="panel-1" tabindex="0">Grub Screws</button>
            <button class="tab" id="tab-2" role="tab" aria-selected="false" aria-controls="panel-2" tabindex="-1">Button Head Screws</button>
            <button class="tab" id="tab-3" role="tab" aria-selected="false" aria-controls="panel-3" tabindex="-1">Counter Sink Screws</button>
            <button class="tab" id="tab-4" role="tab" aria-selected="false" aria-controls="panel-4" tabindex="-1">Bolts(Hex Head)</button>
            <button class="tab" id="tab-5" role="tab" aria-selected="false" aria-controls="panel-5" tabindex="-1">Capheads</button>
            <button class="tab" id="tab-6" role="tab" aria-selected="false" aria-controls="panel-6" tabindex="-1">Key Steel</button>
            <button class="tab" id="tab-7" role="tab" aria-selected="false" aria-controls="panel-7" tabindex="-1">Washers</button>
            <button class="tab" id="tab-8" role="tab" aria-selected="false" aria-controls="panel-8" tabindex="-1">Spring Washers</button>
            <button class="tab" id="tab-9" role="tab" aria-selected="false" aria-controls="panel-9" tabindex="-1">Nylon Insert Nuts</button>
            <button class="tab" id="tab-10" role="tab" aria-selected="false" aria-controls="panel-10" tabindex="-1">Nuts</button>
            <button class="tab" id="tab-11" role="tab" aria-selected="false" aria-controls="panel-11" tabindex="-1">Shoulder Bolt</button>
            <button class="tab" id="tab-12" role="tab" aria-selected="false" aria-controls="panel-12" tabindex="-1">Hardened Dowels</button>
        </div>

        <!-- Panel for Grub Screws -->
        <section class="tab-panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
            <div class="inner-box">
                <button type="button" class="grub item">M4 x 6</button>
                <button type="button" class="grub item">M5 x 5</button>
                <button type="button" class="grub item">M5 x 8</button>
                <button type="button" class="grub item">M5 x 10</button>
            </div>
        </section>

        <!-- Panel for Button Head Screws -->
        <section class="tab-panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden><div class="inner-box">
            <button type="button" class="BH item">M4 x 6</button>
            <button type="button" class="BH item">M4 x 16</button>
            <button type="button" class="BH item">M5 x 10</button>
            <button type="button" class="BH item">M5 x 25</button>
            <button type="button" class="BH item">M5 x 60</button>
            <button type="button" class="BH item">M6 x 6</button>
            <button type="button" class="BH item">M6 x 10</button>
            <button type="button" class="BH item">M10 x 16</button>
            <button type="button" class="BH item">M10 x 40 (t40)</button>
            </div>
        </section>

        <!-- Panel for Counter Sink Screws -->
        <section class="tab-panel" id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden><div class="inner-box">
            <button type="button" class="CS item">M3 x 6</button>
            <button type="button" class="CS item">M4 x 6</button>
            <button type="button" class="CS item">M4 x 10</button>
            <button type="button" class="CS item">M4 x 12</button>
            <button type="button" class="CS item">M4 x 16</button>
            <button type="button" class="CS item">M5 x 16</button>
            <button type="button" class="CS item">M6 x 12</button>
            <button type="button" class="CS item">M6 x 16</button>
            </div>
        </section>

        <!-- Panel for Bolts (Hex Head) -->
        <section class="tab-panel" id="panel-4" role="tabpanel" aria-labelledby="tab-4" hidden><div class="inner-box">
            <button type="button" class="BHH item">M5 x 10</button>
            <button type="button" class="BHH item">M6 x 12</button>
            <button type="button" class="BHH item">M8 x 25</button>
            <button type="button" class="BHH item">M8 x 30</button>
            <button type="button" class="BHH item">M8 x 40</button>
            </div>
        </section>

        <!-- Panel for Caphead Screws -->
        <section class="tab-panel" id="panel-5" role="tabpanel" aria-labelledby="tab-5" hidden><div class="inner-box">
            <button type="button" class="CHS item">M3 x 6</button>
            <button type="button" class="CHS item">M3 x 12</button>
            <button type="button" class="CHS item">M4 x 6</button>
            <button type="button" class="CHS item">M4 x 10</button>
            <button type="button" class="CHS item">M4 x 12</button>
            <button type="button" class="CHS item">M4 x 25</button>
            <button type="button" class="CHS item">M4 x 35</button>
            <button type="button" class="CHS item">M5 x 10</button>
            <button type="button" class="CHS item">M5 x 12</button>
            <button type="button" class="CHS item">M5 x 16</button>
            <button type="button" class="CHS item">M5 x 25</button>
            <button type="button" class="CHS item">M5 x 30</button>
            <button type="button" class="CHS item">M5 x 40</button>
            <button type="button" class="CHS item">M6 x 10</button>
            <button type="button" class="CHS item">M6 x 12</button>
            <button type="button" class="CHS item">M6 x 20</button>
            <button type="button" class="CHS item">M6 x 25</button>
            <button type="button" class="CHS item">M6 x 30</button>
            <button type="button" class="CHS item">M6 x 35</button>
            <button type="button" class="CHS item">M6 x 40</button>
            <button type="button" class="CHS item">M8 x 16</button>
            <button type="button" class="CHS item">M8 x 20</button>
            <button type="button" class="CHS item">M8 x 25</button>
            <button type="button" class="CHS item">M8 x 30</button>
            <button type="button" class="CHS item">M10 x 40 (t40)</button>
            <button type="button" class="CHS item">M12 x 30</button>
            </div>
        </section>

        <!-- Panel for Key Steel -->
        <section class="tab-panel" id="panel-6" role="tabpanel" aria-labelledby="tab-6" hidden><div class="inner-box">
            <button type="button" class="KS item">5 x 5 x 14</button>
            <button type="button" class="KS item">5 x 5 x 20</button>
            <button type="button" class="KS item">5 x 5 x 25</button>
            <button type="button" class="KS item">6 x 6 x 25</button>
            </div>
        </section>

        <!-- Panel for Washers -->
        <section class="tab-panel" id="panel-7" role="tabpanel" aria-labelledby="tab-7" hidden><div class="inner-box">
            <button type="button" class="WS item">M4 x 9</button>
            <button type="button" class="WS item">M6 x 15</button>
            <button type="button" class="WS item">M6 x 25</button>
            <button type="button" class="WS item">M8 x 17</button>
            </div>
        </section>

        <!-- Panel for Spring Washers -->
        <section class="tab-panel" id="panel-8" role="tabpanel" aria-labelledby="tab-8" hidden><div class="inner-box">
            <button type="button" class="SWS item">M6</button>
            <button type="button" class="SWS item">M8</button>
            </div>
        </section>

        <!-- Panel for Nylon Insert Nut -->
        <section class="tab-panel" id="panel-9" role="tabpanel" aria-labelledby="tab-9" hidden><div class="inner-box">
            <button type="button" class="NIN item">M4</button>
            <button type="button" class="NIN item">M5</button>
            <button type="button" class="NIN item">M6</button>
            <button type="button" class="NIN item">M8</button>
            </div>
        </section>

        <!-- Panel for Nut -->
        <section class="tab-panel" id="panel-10" role="tabpanel" aria-labelledby="tab-10" hidden><div class="inner-box">
            <button type="button" class="NUT item">M5</button>
            <button type="button" class="NUT item">M6</button>
            <button type="button" class="NUT item">M8</button>
            <button type="button" class="NUT item">M12</button>
            <button type="button" class="HNUT item">M12 (Half)</button>
            <button type="button" class="NUT item">M16</button>
            <button type="button" class="HNUT item">M16 (Half)</button>
            </div>
        </section>
        <section class="tab-panel" id="panel-11" role="tabpanel" aria-labelledby="tab-11" hidden><div class="inner-box"><p class="hint">Add things for tab 11 here.</p></div></section>
        <section class="tab-panel" id="panel-12" role="tabpanel" aria-labelledby="tab-12" hidden><div class="inner-box"><p class="hint">Add things for tab 12 here.</p></div></section>
        </main>
    </div>
    <script src="supabase-config.js?v=shared-cart-1"></script>
    <script src="inventory.js"></script>
    <script src="ani.js?v=shared-cart-1"></script>
</body>
</html>
